<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crop PDF Margins | ToolsHub</title>
  <meta name="description" content="Trim white margins from every page of a PDF. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Crop PDF Margins" data-ur="PDF مارجن کراپ کریں">Crop PDF Margins</h1>
      <p class="sub" data-en="Trim white margins from every page of a PDF." data-ur="PDF کے ہر صفحے کے سفید مارجن کاٹیں۔">Trim white margins from every page of a PDF.</p>
      <div class="panel">
<div class="dropzone" id="dz"><div class="big">📄</div><strong data-en="Click to choose a PDF or drag &amp; drop here" data-ur="PDF چنیں یا یہاں ڈراپ کریں">Click to choose a PDF or drag &amp; drop here</strong><small data-en="PDF file" data-ur="PDF فائل">PDF file</small></div><input type="file" id="fi" accept="application/pdf,.pdf" hidden><div id="work" hidden><div class="options"><label><span data-en="Top (mm)" data-ur="اوپر (ملی میٹر)">Top (mm)</span><input type="number" id="mt" value="10" dir="ltr" min="0"></label><label><span data-en="Bottom (mm)" data-ur="نیچے (ملی میٹر)">Bottom (mm)</span><input type="number" id="mb" value="10" dir="ltr" min="0"></label><label><span data-en="Left (mm)" data-ur="بائیں (ملی میٹر)">Left (mm)</span><input type="number" id="ml" value="10" dir="ltr" min="0"></label><label><span data-en="Right (mm)" data-ur="دائیں (ملی میٹر)">Right (mm)</span><input type="number" id="mr" value="10" dir="ltr" min="0"></label></div><div class="actions" style="margin-top:16px"><button class="btn green" id="dl" type="button" data-en="Download" data-ur="ڈاؤن لوڈ">Download</button></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Add a PDF, set how many millimetres to trim from each side, then download." data-ur="PDF شامل کریں، ہر طرف سے کتنے ملی میٹر کاٹنے ہیں لکھیں اور ڈاؤن لوڈ کریں۔">Add a PDF, set how many millimetres to trim from each side, then download.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/fileio.js"></script>
  <script src="../js/pdf-crop.js"></script>
</body>
</html>
