<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aspect Ratio Calculator | ToolsHub</title>
  <meta name="description" content="Find the ratio and resize while keeping it. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Aspect Ratio Calculator" data-ur="ایسپیکٹ ریشو کیلکولیٹر">Aspect Ratio Calculator</h1>
      <p class="sub" data-en="Find the ratio and resize while keeping it." data-ur="ریشو معلوم کریں اور اسی ریشو میں سائز بدلیں۔">Find the ratio and resize while keeping it.</p>
      <div class="panel">
<div class="options"><label><span data-en="Width" data-ur="چوڑائی">Width</span><input type="number" id="w" value="1920" dir="ltr" ></label><label><span data-en="Height" data-ur="اونچائی">Height</span><input type="number" id="h" value="1080" dir="ltr" ></label></div><div class="stats"><div class="stat"><b id="ra">-</b><span data-en="Ratio" data-ur="ریشو">Ratio</span></div><div class="stat"><b id="dc">-</b><span data-en="Decimal" data-ur="اعشاریہ">Decimal</span></div></div><div class="options"><label><span data-en="New width" data-ur="نئی چوڑائی">New width</span><input type="number" id="nw" value="1280" dir="ltr" ></label><label><span data-en="New height" data-ur="نئی اونچائی">New height</span><input type="number" id="nh" value="720" dir="ltr" ></label></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Enter width and height to see the ratio. Then type a new width or height to get the other side." data-ur="چوڑائی اور اونچائی سے ریشو دیکھیں۔ پھر نئی چوڑائی یا اونچائی لکھیں تو دوسری خود نکل آئے گی۔">Enter width and height to see the ratio. Then type a new width or height to get the other side.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/aspect-ratio.js"></script>
</body>
</html>
