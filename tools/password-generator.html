<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Password Generator - Strong Random Passwords | ToolsHub</title>
  <meta name="description" content="Generate strong, random passwords instantly. Choose length and characters. Free, works in your browser, nothing is stored or sent.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    .pw-out{display:flex;gap:10px;align-items:center;margin-top:4px}
    #pw{flex:1;min-width:0;padding:14px;border-radius:14px;font:1.15rem/1.4 ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:inherit}
    .meter{height:8px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:12px;overflow:hidden}
    .meter i{display:block;height:100%;width:0;border-radius:99px;transition:width .25s,background .25s}
    .opt-grid{display:grid;gap:12px;margin-top:16px}
    .opt-grid label{display:flex;gap:8px;align-items:center;cursor:pointer}
    .len-row{display:flex;gap:12px;align-items:center;margin-top:16px}
    .len-row input[type=range]{flex:1}
  </style>
</head>
<body data-root="../">

  <header id="site-header"></header>

  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Password Generator" data-ur="پاس ورڈ جنریٹر">Password Generator</h1>
      <p class="sub" data-en="Create a strong random password in one click."
         data-ur="ایک کلک میں مضبوط رینڈم پاس ورڈ بنائیں۔">Create a strong random password in one click.</p>

      <div class="panel">
        <div class="pw-out">
          <input type="text" id="pw" readonly aria-label="Password">
          <button class="btn green" id="copyBtn" type="button" data-en="Copy" data-ur="کاپی">Copy</button>
        </div>
        <div class="meter"><i id="meter"></i></div>
        <div class="status" id="status"></div>

        <div class="len-row">
          <span><span data-en="Length" data-ur="لمبائی">Length</span>: <b id="lenVal">16</b></span>
          <input type="range" id="len" min="6" max="64" value="16" dir="ltr">
        </div>

        <div class="opt-grid">
          <label><input type="checkbox" id="oUp" checked> <span data-en="Uppercase (A-Z)" data-ur="بڑے حروف (A-Z)">Uppercase (A-Z)</span></label>
          <label><input type="checkbox" id="oLow" checked> <span data-en="Lowercase (a-z)" data-ur="چھوٹے حروف (a-z)">Lowercase (a-z)</span></label>
          <label><input type="checkbox" id="oNum" checked> <span data-en="Numbers (0-9)" data-ur="نمبر (0-9)">Numbers (0-9)</span></label>
          <label><input type="checkbox" id="oSym" checked> <span data-en="Symbols (!@#$...)" data-ur="علامات (!@#$...)">Symbols (!@#$...)</span></label>
          <label><input type="checkbox" id="oSim"> <span data-en="Avoid look-alike characters (O 0 l 1 I)" data-ur="ملتے جلتے حروف سے بچیں (O 0 l 1 I)">Avoid look-alike characters (O 0 l 1 I)</span></label>
        </div>

        <div class="actions" style="margin-top:16px">
          <button class="btn" id="genBtn" type="button" data-en="Generate new" data-ur="نیا بنائیں">Generate new</button>
        </div>
      </div>

      <div class="ad-slot">Ad space</div>

      <div class="panel info">
        <h2 data-en="Tips" data-ur="مشورے">Tips</h2>
        <ol>
          <li data-en="Use 14 or more characters for important accounts." data-ur="اہم اکاؤنٹس کے لیے 14 یا زیادہ حروف رکھیں۔">Use 14 or more characters for important accounts.</li>
          <li data-en="Use a different password for every site." data-ur="ہر ویب سائٹ کے لیے الگ پاس ورڈ رکھیں۔">Use a different password for every site.</li>
          <li data-en="Save it in a password manager." data-ur="اسے پاس ورڈ مینیجر میں محفوظ کریں۔">Save it in a password manager.</li>
        </ol>
        <p data-en="Passwords are made in your browser. Nothing is stored or sent." data-ur="پاس ورڈ آپ کے براؤزر میں بنتے ہیں۔ کچھ محفوظ یا ارسال نہیں ہوتا۔">Passwords are made in your browser. Nothing is stored or sent.</p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/common.js"></script>
  <script src="../js/password-generator.js"></script>
</body>
</html>
