<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hash Generator - SHA-256, SHA-1, SHA-512 | ToolsHub</title>
  <meta name="description" content="Generate SHA-1, SHA-256, SHA-384 and SHA-512 hashes of text or a file. Free, runs in your browser.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    textarea.t{width:100%;min-height:150px;padding:14px;border-radius:14px;resize:vertical;font-size:1rem;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:inherit}
    .stage{display:flex;justify-content:center;margin-top:16px}
    .stage canvas,.stage img{max-width:100%;max-height:420px;border-radius:12px;background:#111}
    .h{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1);cursor:pointer}.h b{width:70px;flex:none}.h code{word-break:break-all;font-size:.82rem}
  </style>
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Hash Generator" data-ur="ہیش جنریٹر">Hash Generator</h1>
      <p class="sub" data-en="Get SHA hashes of text or a file." data-ur="متن یا فائل کا SHA ہیش حاصل کریں۔">Get SHA hashes of text or a file.</p>
      <div class="panel">
        <textarea class="t" id="txt" dir="auto" spellcheck="false" style="min-height:110px" data-en-ph="Type text, or choose a file below" data-ur-ph="متن لکھیں، یا نیچے سے فائل چنیں" placeholder="Type text, or choose a file below"></textarea>
        <div class="options" style="margin-top:12px"><input type="file" id="file"> <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="up"><span data-en="UPPERCASE" data-ur="بڑے حروف">UPPERCASE</span></label></div>
        <div id="res" style="margin-top:14px;direction:ltr"></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <ol>
          <li data-en="Type text or choose a file." data-ur="متن لکھیں یا فائل چنیں۔">Type text or choose a file.</li>
          <li data-en="Hashes appear instantly. Click one to copy." data-ur="ہیش فوراً نظر آتے ہیں۔ کاپی کرنے کے لیے کلک کریں۔">Hashes appear instantly. Click one to copy.</li>
        </ol>
        <p data-en="Your files never leave your device." data-ur="آپ کی فائلیں آپ کے آلے سے باہر نہیں جاتیں۔">Your files never leave your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/hash-generator.js"></script>
</body>
</html>
