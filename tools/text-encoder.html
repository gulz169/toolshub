<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Text to Binary, Hex &amp; Morse | ToolsHub</title>
  <meta name="description" content="Convert text to binary, hex or Morse code and back. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Text to Binary, Hex &amp; Morse" data-ur="ٹیکسٹ سے بائنری، ہیکس اور مورس">Text to Binary, Hex &amp; Morse</h1>
      <p class="sub" data-en="Convert text to binary, hex or Morse code and back." data-ur="ٹیکسٹ کو بائنری، ہیکس یا مورس کوڈ میں بدلیں اور واپس۔">Convert text to binary, hex or Morse code and back.</p>
      <div class="panel">
<div class="options"><label><span data-en="Format" data-ur="فارمیٹ">Format</span><select id="m"><option value="bin">Binary</option><option value="hex">Hex</option><option value="morse">Morse code</option></select></label><label><span data-en="Direction" data-ur="سمت">Direction</span><select id="d"><option value="enc">Text → Code</option><option value="dec">Code → Text</option></select></label></div><textarea class="t" id="i" dir="auto" style="min-height:110px" placeholder="Hello"></textarea><div class="actions" style="margin:10px 0"><button class="btn green" id="cp" type="button" data-en="Copy result" data-ur="نتیجہ کاپی کریں">Copy result</button></div><textarea class="t" id="o" dir="auto" style="min-height:110px" placeholder="" readonly></textarea>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Pick a format and direction, then type your text." data-ur="فارمیٹ اور سمت چنیں، پھر ٹیکسٹ لکھیں۔">Pick a format and direction, then type your text.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/text-encoder.js"></script>
</body>
</html>
