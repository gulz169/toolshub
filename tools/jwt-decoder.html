<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="JWT Decoder" data-ur="JWT ڈیکوڈر">JWT Decoder</h1>
      <p class="sub" data-en="Decode a JSON Web Token in your browser." data-ur="JSON Web Token کو براؤزر میں ہی ڈیکوڈ کریں۔">Decode a JSON Web Token in your browser.</p>
      <div class="panel">
<textarea class="t" id="i" dir="auto" style="min-height:100px" placeholder="eyJ..."></textarea><h3 style="margin:14px 0 6px">Header</h3><textarea class="t" id="h" dir="auto" style="min-height:90px" placeholder="" readonly></textarea><h3 style="margin:14px 0 6px">Payload</h3><textarea class="t" id="p" dir="auto" style="min-height:150px" placeholder="" readonly></textarea><div class="stats"><div class="stat"><b id="ex">-</b><span data-en="Expires" data-ur="ختم ہوتا ہے">Expires</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Paste a JWT. The header and payload are decoded here. The signature is not verified." data-ur="JWT پیسٹ کریں۔ ہیڈر اور پے لوڈ یہیں ڈیکوڈ ہوں گے۔ سگنیچر کی تصدیق نہیں ہوتی۔">Paste a JWT. The header and payload are decoded here. The signature is not verified.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
