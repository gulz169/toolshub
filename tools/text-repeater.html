<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Text Repeater | ToolsHub</title>
  <meta name="description" content="Repeat any text many times. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Text Repeater" data-ur="ٹیکسٹ دہرائیں">Text Repeater</h1>
      <p class="sub" data-en="Repeat any text many times." data-ur="کسی بھی ٹیکسٹ کو کئی بار دہرائیں۔">Repeat any text many times.</p>
      <div class="panel">
<div class="options"><label><span data-en="Text" data-ur="ٹیکسٹ">Text</span><input id="i" type="text" dir="ltr" value="Hello" style="padding:9px 12px;border-radius:12px;width:min(300px,100%)"></label><label><span data-en="Times" data-ur="بار">Times</span><input type="number" id="n" value="5" dir="ltr" min="1" max="10000"></label><label><span data-en="Separator" data-ur="جدا کنندہ">Separator</span><select id="s"><option value=" ">Space</option><option value="\n">New line</option><option value=", ">Comma</option><option value="">None</option></select></label></div><div class="actions" style="margin:10px 0"><button class="btn green" id="cp" type="button" data-en="Copy" data-ur="کاپی کریں">Copy</button></div><textarea class="t" id="o" dir="auto" style="min-height:150px" placeholder="" readonly></textarea>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Type text, how many times and a separator." data-ur="ٹیکسٹ، تعداد اور جدا کنندہ لکھیں۔">Type text, how many times and a separator.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/text-repeater.js"></script>
</body>
</html>
