<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Gold Calculator (Tola, Masha, Ratti)" data-ur="سونا کیلکولیٹر (تولہ، ماشہ، رتی)">Gold Calculator (Tola, Masha, Ratti)</h1>
      <p class="sub" data-en="Convert gold weight and find its value by karat." data-ur="سونے کا وزن کنورٹ کریں اور کیرٹ کے حساب سے قیمت معلوم کریں۔">Convert gold weight and find its value by karat.</p>
      <div class="panel">
<div class="options"><label><span data-en="Weight" data-ur="وزن">Weight</span><input type="number" id="w" value="1" dir="ltr" step="any"></label><label><span data-en="Unit" data-ur="یونٹ">Unit</span><select id="u"><option value="11.664">Tola</option><option value="0.972">Masha</option><option value="0.12150">Ratti</option><option value="1">Gram</option></select></label><label><span data-en="Karat" data-ur="کیرٹ">Karat</span><select id="k"><option value="24">24k</option><option value="22">22k</option><option value="21">21k</option><option value="18">18k</option></select></label><label><span data-en="Price per tola (24k)" data-ur="فی تولہ قیمت (24k)">Price per tola (24k)</span><input type="number" id="pr" value="250000" dir="ltr" ></label></div><div class="stats"><div class="stat"><b id="g">-</b><span data-en="Grams" data-ur="گرام">Grams</span></div><div class="stat"><b id="tl">-</b><span data-en="Tola" data-ur="تولہ">Tola</span></div><div class="stat"><b id="pure">-</b><span data-en="Pure gold (g)" data-ur="خالص سونا (گرام)">Pure gold (g)</span></div><div class="stat"><b id="val">-</b><span data-en="Value" data-ur="قیمت">Value</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Enter weight, karat and the price of 1 tola of 24k gold (check the local rate today)." data-ur="وزن، کیرٹ اور 24 کیرٹ کے ایک تولے کی قیمت لکھیں (آج کا مقامی ریٹ دیکھ لیں)۔">Enter weight, karat and the price of 1 tola of 24k gold (check the local rate today).</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
