<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="Shrink CSS or HTML code to load faster. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">

<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="CSS &amp; HTML Minifier" data-ur="CSS اور HTML مینیفائر">CSS &amp; HTML Minifier</h1>
      <p class="sub" data-en="Shrink CSS or HTML code to load faster." data-ur="CSS یا HTML کوڈ چھوٹا کریں تاکہ تیزی سے لوڈ ہو۔">Shrink CSS or HTML code to load faster.</p>
      <div class="panel">
<div class="options"><label><span data-en="Type" data-ur="قسم">Type</span><select id="m"><option value="css">CSS</option><option value="html">HTML</option></select></label></div><textarea class="t" id="i" dir="auto" style="min-height:170px" placeholder=""></textarea><div class="stats"><div class="stat"><b id="sv">-</b><span data-en="Saved" data-ur="بچت">Saved</span></div></div><textarea class="t" id="o" dir="auto" style="min-height:150px" placeholder="" readonly></textarea><div class="actions" style="margin-top:10px"><button class="btn green" id="cp" type="button" data-en="Copy" data-ur="کاپی کریں">Copy</button></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Choose CSS or HTML, paste your code and copy the small version." data-ur="CSS یا HTML چنیں، کوڈ پیسٹ کریں اور چھوٹا ورژن کاپی کریں۔">Choose CSS or HTML, paste your code and copy the small version.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/code-minifier.js"></script>
