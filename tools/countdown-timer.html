<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Countdown to a Date | ToolsHub</title>
  <meta name="description" content="See days, hours and minutes left until any date. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Countdown to a Date" data-ur="تاریخ تک کاؤنٹ ڈاؤن">Countdown to a Date</h1>
      <p class="sub" data-en="See days, hours and minutes left until any date." data-ur="کسی بھی تاریخ تک کے دن، گھنٹے اور منٹ دیکھیں۔">See days, hours and minutes left until any date.</p>
      <div class="panel">
<div class="options"><label><span data-en="Target date" data-ur="ہدف کی تاریخ">Target date</span><input type="datetime-local" id="dt" dir="ltr" style="padding:9px 12px;border-radius:12px"></label></div><div class="stats"><div class="stat"><b id="d">-</b><span data-en="Days" data-ur="دن">Days</span></div><div class="stat"><b id="h">-</b><span data-en="Hours" data-ur="گھنٹے">Hours</span></div><div class="stat"><b id="m">-</b><span data-en="Minutes" data-ur="منٹ">Minutes</span></div><div class="stat"><b id="s">-</b><span data-en="Seconds" data-ur="سیکنڈ">Seconds</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Pick a date and time. The countdown updates every second." data-ur="تاریخ اور وقت چنیں۔ کاؤنٹ ڈاؤن ہر سیکنڈ بدلتا ہے۔">Pick a date and time. The countdown updates every second.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/countdown-timer.js"></script>
</body>
</html>
