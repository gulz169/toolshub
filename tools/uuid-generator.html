<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UUID Generator | ToolsHub</title>
  <meta name="description" content="Generate random UUIDs (v4) in bulk. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="UUID Generator" data-ur="UUID جنریٹر">UUID Generator</h1>
      <p class="sub" data-en="Generate random UUIDs (v4) in bulk." data-ur="رینڈم UUID (v4) ایک ساتھ بنائیں۔">Generate random UUIDs (v4) in bulk.</p>
      <div class="panel">
<div class="options"><label><span data-en="How many" data-ur="کتنے">How many</span><input type="number" id="n" value="5" dir="ltr" min="1" max="500"></label><label><span data-en="Format" data-ur="فارمیٹ">Format</span><select id="c"><option value="l">lowercase</option><option value="u">UPPERCASE</option><option value="nh">no hyphens</option></select></label></div><div class="actions"><button class="btn" id="go" type="button" data-en="Generate" data-ur="بنائیں">Generate</button><button class="btn green" id="cp" type="button" data-en="Copy all" data-ur="سب کاپی کریں">Copy all</button></div><textarea class="t" id="o" dir="auto" style="min-height:160px" placeholder="" readonly></textarea>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Choose how many, tap Generate, then copy." data-ur="تعداد چنیں، Generate دبائیں اور کاپی کریں۔">Choose how many, tap Generate, then copy.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/uuid-generator.js"></script>
</body>
</html>
