<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Color Contrast Checker | ToolsHub</title>
  <meta name="description" content="Check if text and background colors are readable (WCAG). Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Color Contrast Checker" data-ur="کلر کنٹراسٹ چیکر">Color Contrast Checker</h1>
      <p class="sub" data-en="Check if text and background colors are readable (WCAG)." data-ur="چیک کریں کہ ٹیکسٹ اور بیک گراؤنڈ رنگ پڑھنے کے قابل ہیں (WCAG)۔">Check if text and background colors are readable (WCAG).</p>
      <div class="panel">
<div class="options"><label><span data-en="Text color" data-ur="ٹیکسٹ رنگ">Text color</span><input type="color" id="fg" value="#ffffff" style="width:70px;height:42px"></label><label><span data-en="Background" data-ur="بیک گراؤنڈ">Background</span><input type="color" id="bg" value="#7c3aed" style="width:70px;height:42px"></label></div><div id="pv" style="padding:22px;border-radius:16px;font-size:1.3rem;font-weight:700;text-align:center">Sample text 123</div><div class="stats"><div class="stat"><b id="ra">-</b><span data-en="Contrast ratio" data-ur="کنٹراسٹ ریشو">Contrast ratio</span></div><div class="stat"><b id="aa">-</b><span data-en="AA normal text" data-ur="AA عام ٹیکسٹ">AA normal text</span></div><div class="stat"><b id="al">-</b><span data-en="AA large text" data-ur="AA بڑا ٹیکسٹ">AA large text</span></div><div class="stat"><b id="aaa">-</b><span data-en="AAA normal text" data-ur="AAA عام ٹیکسٹ">AAA normal text</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Pick a text color and a background color." data-ur="ٹیکسٹ اور بیک گراؤنڈ کا رنگ چنیں۔">Pick a text color and a background color.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/contrast-checker.js"></script>
</body>
</html>
