<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fancy Text Generator - Cool Fonts Copy Paste | ToolsHub</title>
  <meta name="description" content="Turn text into bold, italic, script, bubble and other fancy styles to copy and paste. Free.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    textarea.t{width:100%;min-height:150px;padding:14px;border-radius:14px;resize:vertical;font-size:1rem;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:inherit}
    .stage{display:flex;justify-content:center;margin-top:16px}
    .stage canvas,.stage img{max-width:100%;max-height:420px;border-radius:12px;background:#111}
    .row{padding:11px 14px;margin-top:8px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);cursor:pointer;font-size:1.15rem;word-break:break-word}.row:hover{border-color:#34d399}.row small{display:block;font-size:.72rem;opacity:.6;margin-bottom:2px}
  </style>
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Fancy Text Generator" data-ur="فینسی ٹیکسٹ جنریٹر">Fancy Text Generator</h1>
      <p class="sub" data-en="Make stylish text for bios and captions. Click to copy." data-ur="بایو اور کیپشن کے لیے اسٹائلش متن بنائیں۔ کاپی کے لیے کلک کریں۔">Make stylish text for bios and captions. Click to copy.</p>
      <div class="panel">
        <input type="text" id="txt" value="ToolsHub" dir="auto" style="width:100%;font-size:1.2rem" maxlength="200">
        <div id="out" style="margin-top:14px"></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <ol>
          <li data-en="Type your text." data-ur="اپنا متن لکھیں۔">Type your text.</li>
          <li data-en="Click any style to copy it." data-ur="کسی بھی اسٹائل پر کلک کر کے کاپی کریں۔">Click any style to copy it.</li>
        </ol>
        <p data-en="Styles work on English letters and numbers only. Some apps may not show every style." data-ur="اسٹائل صرف انگریزی حروف اور اعداد پر چلتے ہیں۔ کچھ ایپس ہر اسٹائل نہیں دکھاتیں۔">Styles work on English letters and numbers only. Some apps may not show every style.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/fancy-text.js"></script>
</body>
</html>
