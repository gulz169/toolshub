<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Age Calculator - Exact Age in Years, Months, Days | ToolsHub</title>
  <meta name="description" content="Find your exact age in years, months and days, total days lived and days until your next birthday. Free, no signup.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:16px}
    .stat{padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:center}
    .stat b{display:block;font-size:1.6rem}
    .stat span{font-size:.85rem;opacity:.75}
  </style>
</head>
<body data-root="../">

  <header id="site-header"></header>

  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Age Calculator" data-ur="عمر کیلکولیٹر">Age Calculator</h1>
      <p class="sub" data-en="Enter a date of birth to see the exact age."
         data-ur="تاریخ پیدائش درج کریں اور درست عمر دیکھیں۔">Enter a date of birth to see the exact age.</p>

      <div class="panel">
        <div class="options">
          <label><span data-en="Date of birth" data-ur="تاریخ پیدائش">Date of birth</span>
            <input type="date" id="dob"></label>
          <label><span data-en="Age on" data-ur="اس تاریخ پر عمر">Age on</span>
            <input type="date" id="asof"></label>
        </div>
        <div class="stats" id="out" hidden>
          <div class="stat"><b id="y">0</b><span data-en="Years" data-ur="سال">Years</span></div>
          <div class="stat"><b id="m">0</b><span data-en="Months" data-ur="مہینے">Months</span></div>
          <div class="stat"><b id="d">0</b><span data-en="Days" data-ur="دن">Days</span></div>
          <div class="stat"><b id="td">0</b><span data-en="Total days" data-ur="کل دن">Total days</span></div>
          <div class="stat"><b id="nb">0</b><span data-en="Days to next birthday" data-ur="اگلی سالگرہ میں دن">Days to next birthday</span></div>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="ad-slot">Ad space</div>

      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <ol>
          <li data-en="Pick your date of birth." data-ur="اپنی تاریخ پیدائش چنیں۔">Pick your date of birth.</li>
          <li data-en="The result shows instantly." data-ur="نتیجہ فوراً نظر آتا ہے۔">The result shows instantly.</li>
        </ol>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/common.js"></script>
  <script src="../js/age-calculator.js"></script>
</body>
</html>
