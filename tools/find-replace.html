<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Find &amp; Replace | ToolsHub</title>
  <meta name="description" content="Find and replace text in bulk. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Find &amp; Replace" data-ur="تلاش اور تبدیلی">Find &amp; Replace</h1>
      <p class="sub" data-en="Find and replace text in bulk." data-ur="متن میں الفاظ تلاش کریں اور ایک ساتھ بدلیں۔">Find and replace text in bulk.</p>
      <div class="panel">
<textarea class="t" id="i" dir="auto" style="min-height:130px" placeholder=""></textarea><div class="options"><label><span data-en="Find" data-ur="تلاش">Find</span><input id="f" type="text" dir="ltr" value="" style="padding:9px 12px;border-radius:12px;width:min(300px,100%)"></label><label><span data-en="Replace with" data-ur="تبدیل">Replace with</span><input id="r" type="text" dir="ltr" value="" style="padding:9px 12px;border-radius:12px;width:min(300px,100%)"></label><label><span data-en="Case" data-ur="کیس">Case</span><select id="cs"><option value="i">Ignore case</option><option value="s">Match case</option></select></label><label><span data-en="Mode" data-ur="موڈ">Mode</span><select id="rx"><option value="t">Plain text</option><option value="x">Regex</option></select></label></div><div class="stats"><div class="stat"><b id="c">-</b><span data-en="Replacements" data-ur="تبدیلیاں">Replacements</span></div></div><div class="actions" style="margin:10px 0"><button class="btn green" id="cp" type="button" data-en="Copy" data-ur="کاپی کریں">Copy</button></div><textarea class="t" id="o" dir="auto" style="min-height:130px" placeholder="" readonly></textarea>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Paste text, enter what to find and its replacement. Turn on regex if you need patterns." data-ur="ٹیکسٹ پیسٹ کریں، تلاش اور تبدیلی کا لفظ لکھیں۔ پیٹرن کے لیے regex آن کریں۔">Paste text, enter what to find and its replacement. Turn on regex if you need patterns.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/find-replace.js"></script>
</body>
</html>
