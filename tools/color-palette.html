<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Color Palette from Image - Extract Colors | ToolsHub</title>
  <meta name="description" content="Pick the main colors from any image and copy their HEX codes. Free, no upload.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    textarea.t{width:100%;min-height:150px;padding:14px;border-radius:14px;resize:vertical;font-size:1rem;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:inherit}
    .stage{display:flex;justify-content:center;margin-top:16px}
    .stage canvas,.stage img{max-width:100%;max-height:420px;border-radius:12px;background:#111}
    #sw button{height:96px;border-radius:14px;border:1px solid rgba(255,255,255,.25);cursor:pointer;font:700 .95rem ui-monospace,Menlo,Consolas,monospace;display:flex;align-items:flex-end;justify-content:center;padding:8px}
  </style>
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Color Palette from Image" data-ur="تصویر سے رنگوں کا پیلیٹ">Color Palette from Image</h1>
      <p class="sub" data-en="Find the main colors of a photo and copy their codes." data-ur="تصویر کے اہم رنگ معلوم کریں اور ان کے کوڈ کاپی کریں۔">Find the main colors of a photo and copy their codes.</p>
      <div class="panel">
        <div class="dropzone" id="dropzone">
          <div class="big">🖼️</div>
          <strong data-en="Click to choose an image or drag &amp; drop here" data-ur="تصویر چنیں یا یہاں ڈراپ کریں">Click to choose an image or drag &amp; drop here</strong>
          <small data-en="JPG, PNG or WebP" data-ur="JPG، PNG یا WebP">JPG, PNG or WebP</small>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
        <div id="work" hidden>
          <div class="stage"><img id="prev" alt=""></div>
          <div class="options" style="margin-top:14px"><label><span data-en="Colors" data-ur="رنگ">Colors</span><select id="cnt"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></label></div>
          <div id="sw" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:14px;direction:ltr"></div>
          <div class="actions" style="margin-top:14px"><button class="btn" id="copyAll" type="button" data-en="Copy all HEX" data-ur="سب HEX کاپی کریں">Copy all HEX</button> <button class="btn ghost" id="newBtn" type="button" data-en="New image" data-ur="نئی تصویر">New image</button></div>
        </div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <ol>
          <li data-en="Add an image." data-ur="تصویر شامل کریں۔">Add an image.</li>
          <li data-en="Click a color to copy its HEX code." data-ur="کسی رنگ پر کلک کر کے اس کا HEX کوڈ کاپی کریں۔">Click a color to copy its HEX code.</li>
        </ol>
        <p data-en="Your files never leave your device." data-ur="آپ کی فائلیں آپ کے آلے سے باہر نہیں جاتیں۔">Your files never leave your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/color-palette.js"></script>
</body>
</html>
