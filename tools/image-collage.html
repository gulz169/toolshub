<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Photo Collage Maker - Combine Images Free | ToolsHub</title>
  <meta name="description" content="Combine several photos into one collage: grid, horizontal or vertical. Free, no upload.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    textarea.t{width:100%;min-height:150px;padding:14px;border-radius:14px;resize:vertical;font-size:1rem;line-height:1.7;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:inherit}
    .stage{display:flex;justify-content:center;margin-top:16px}
    .stage canvas,.stage img{max-width:100%;max-height:420px;border-radius:12px;background:#111}
  </style>
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Photo Collage Maker" data-ur="فوٹو کولاج میکر">Photo Collage Maker</h1>
      <p class="sub" data-en="Combine photos into one image." data-ur="کئی تصاویر کو ایک تصویر میں جوڑیں۔">Combine photos into one image.</p>
      <div class="panel">
        <div class="dropzone" id="dropzone">
          <div class="big">🧩</div>
          <strong data-en="Click to choose images or drag &amp; drop here" data-ur="تصاویر چنیں یا یہاں ڈراپ کریں">Click to choose images or drag &amp; drop here</strong>
          <small data-en="2 to 12 images" data-ur="2 سے 12 تصاویر">2 to 12 images</small>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple hidden>
        <div class="file-list" id="list"></div>
        <div id="work" hidden>
          <div class="options" style="margin-top:16px">
            <label><span data-en="Layout" data-ur="لے آؤٹ">Layout</span><select id="lay"><option value="grid">Grid</option><option value="h">Horizontal strip</option><option value="v">Vertical strip</option></select></label>
            <label><span data-en="Columns (grid)" data-ur="کالم (گرڈ)">Columns (grid)</span><select id="cols"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
            <label><span data-en="Gap" data-ur="فاصلہ">Gap</span><input type="range" id="gap" min="0" max="60" value="12" dir="ltr"></label>
            <label><span data-en="Background" data-ur="پس منظر">Background</span><input type="color" id="bg" value="#ffffff" style="height:42px"></label>
          </div>
          <div class="stage"><canvas id="view"></canvas></div>
          <div class="actions" style="margin-top:16px"><button class="btn green" id="dlBtn" type="button" data-en="Download PNG" data-ur="PNG ڈاؤن لوڈ">Download PNG</button> <button class="btn ghost" id="clearBtn" type="button" data-en="Clear all" data-ur="سب ہٹائیں">Clear all</button></div>
        </div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <ol>
          <li data-en="Add 2 or more photos." data-ur="2 یا زیادہ تصاویر شامل کریں۔">Add 2 or more photos.</li>
          <li data-en="Pick a layout." data-ur="لے آؤٹ چنیں۔">Pick a layout.</li>
          <li data-en="Download the collage." data-ur="کولاج ڈاؤن لوڈ کریں۔">Download the collage.</li>
        </ol>
        <p data-en="Your files never leave your device." data-ur="آپ کی فائلیں آپ کے آلے سے باہر نہیں جاتیں۔">Your files never leave your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/image-collage.js"></script>
</body>
</html>
