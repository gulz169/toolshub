<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calorie &amp; BMR Calculator | ToolsHub</title>
  <meta name="description" content="Estimate daily calories for your body and activity. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Calorie &amp; BMR Calculator" data-ur="کیلوری اور BMR کیلکولیٹر">Calorie &amp; BMR Calculator</h1>
      <p class="sub" data-en="Estimate daily calories for your body and activity." data-ur="اپنے جسم اور سرگرمی کے مطابق روزانہ کیلوریز کا اندازہ لگائیں۔">Estimate daily calories for your body and activity.</p>
      <div class="panel">
<div class="options"><label><span data-en="Sex" data-ur="جنس">Sex</span><select id="sx"><option value="m">Male</option><option value="f">Female</option></select></label><label><span data-en="Age" data-ur="عمر">Age</span><input type="number" id="ag" value="25" dir="ltr" ></label><label><span data-en="Height (cm)" data-ur="قد (سینٹی میٹر)">Height (cm)</span><input type="number" id="ht" value="170" dir="ltr" ></label><label><span data-en="Weight (kg)" data-ur="وزن (کلو)">Weight (kg)</span><input type="number" id="wt" value="70" dir="ltr" ></label><label><span data-en="Activity" data-ur="سرگرمی">Activity</span><select id="ac"><option value="1.2">Little or none</option><option value="1.375">Light (1-3 days/week)</option><option value="1.55">Moderate (3-5 days)</option><option value="1.725">Hard (6-7 days)</option></select></label></div><div class="stats"><div class="stat"><b id="bmr">-</b><span data-en="BMR" data-ur="BMR">BMR</span></div><div class="stat"><b id="mt">-</b><span data-en="Maintain weight" data-ur="وزن برقرار">Maintain weight</span></div><div class="stat"><b id="lo">-</b><span data-en="Lose weight" data-ur="وزن کم">Lose weight</span></div><div class="stat"><b id="ga">-</b><span data-en="Gain weight" data-ur="وزن زیادہ">Gain weight</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Enter age, height, weight and activity. Results are estimates only." data-ur="عمر، قد، وزن اور سرگرمی لکھیں۔ نتائج صرف اندازہ ہیں۔">Enter age, height, weight and activity. Results are estimates only.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/calorie-calculator.js"></script>
</body>
</html>
