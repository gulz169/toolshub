<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CSS Box Shadow Generator | ToolsHub</title>
  <meta name="description" content="Design a box shadow and copy the CSS. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="CSS Box Shadow Generator" data-ur="CSS باکس شیڈو جنریٹر">CSS Box Shadow Generator</h1>
      <p class="sub" data-en="Design a box shadow and copy the CSS." data-ur="باکس شیڈو بنائیں اور CSS کاپی کریں۔">Design a box shadow and copy the CSS.</p>
      <div class="panel">
<div class="options"><label><span data-en="X offset" data-ur="X فاصلہ">X offset</span><input type="number" id="x" value="8" dir="ltr" ></label><label><span data-en="Y offset" data-ur="Y فاصلہ">Y offset</span><input type="number" id="y" value="12" dir="ltr" ></label><label><span data-en="Blur" data-ur="بلر">Blur</span><input type="number" id="b" value="30" dir="ltr" ></label><label><span data-en="Spread" data-ur="پھیلاؤ">Spread</span><input type="number" id="sp" value="0" dir="ltr" ></label><label><span data-en="Color" data-ur="رنگ">Color</span><input type="color" id="c" value="#8b5cf6" style="width:70px;height:42px"></label><label><span data-en="Opacity %" data-ur="دھندلاپن %">Opacity %</span><input type="number" id="op" value="40" dir="ltr" ></label><label><span data-en="Inset" data-ur="اندرونی">Inset</span><select id="in"><option value="">No</option><option value="inset ">Yes</option></select></label></div><div style="display:flex;justify-content:center;padding:36px;border-radius:18px;background:#e9e7f5"><div id="bx" style="width:150px;height:110px;border-radius:16px;background:#fff"></div></div><textarea class="t" id="o" dir="auto" style="min-height:70px" placeholder="" readonly></textarea><div class="actions" style="margin:10px 0"><button class="btn green" id="cp" type="button" data-en="Copy" data-ur="کاپی کریں">Copy</button></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Move the values and see the shadow live." data-ur="ویلیوز بدلیں اور شیڈو فوراً دیکھیں۔">Move the values and see the shadow live.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/box-shadow.js"></script>
</body>
</html>
