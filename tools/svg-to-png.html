<div class="dropzone" id="dz"><div class="big">🔷</div><strong data-en="Click to choose an SVG or drag &amp; drop here" data-ur="SVG چنیں یا یہاں ڈراپ کریں">Click to choose an SVG or drag &amp; drop here</strong><small data-en="SVG file" data-ur="SVG فائل">SVG file</small></div><input type="file" id="fi" accept="image/svg+xml,.svg" hidden><div id="work" hidden><div class="options"><label><span data-en="Scale" data-ur="اسکیل">Scale</span><select id="sc"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option></select></label><label><span data-en="Background" data-ur="بیک گراؤنڈ">Background</span><select id="bg"><option value="t">Transparent</option><option value="w">White</option></select></label></div><div style="text-align:center"><img id="pv" alt="" style="max-width:100%;max-height:300px;background:repeating-conic-gradient(#333 0 25%,#444 0 50%) 50%/20px 20px;border-radius:12px"></div><div class="actions" style="margin-top:16px"><button class="btn green" id="dl" type="button" data-en="Download" data-ur="ڈاؤن لوڈ">Download</button></div></div>
