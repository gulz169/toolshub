<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pick Colors from Image | ToolsHub</title>
  <meta name="description" content="Click anywhere on a photo to get its HEX and RGB color. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Pick Colors from Image" data-ur="تصویر سے رنگ چنیں">Pick Colors from Image</h1>
      <p class="sub" data-en="Click anywhere on a photo to get its HEX and RGB color." data-ur="تصویر پر کہیں بھی کلک کر کے اس کا HEX اور RGB رنگ حاصل کریں۔">Click anywhere on a photo to get its HEX and RGB color.</p>
      <div class="panel">
<div class="dropzone" id="dz"><div class="big">🖼️</div><strong data-en="Click to choose an image or drag &amp; drop here" data-ur="تصویر چنیں یا یہاں ڈراپ کریں">Click to choose an image or drag &amp; drop here</strong><small data-en="JPG, PNG or WebP" data-ur="JPG، PNG یا WebP">JPG, PNG or WebP</small></div><input type="file" id="fi" accept="image/*" hidden><div id="work" hidden><div style="text-align:center"><canvas id="cv" style="max-width:100%;max-height:440px;border-radius:12px;cursor:crosshair"></canvas></div><div id="sw" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px"></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Add an image and tap on it. Tap a result to copy it." data-ur="تصویر شامل کریں اور اس پر ٹیپ کریں۔ کاپی کے لیے نتیجے پر ٹیپ کریں۔">Add an image and tap on it. Tap a result to copy it.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/fileio.js"></script>
  <script src="../js/image-color-picker.js"></script>
</body>
</html>
