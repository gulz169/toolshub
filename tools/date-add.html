<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Add or Subtract Days from a Date | ToolsHub</title>
  <meta name="description" content="Find the date after or before a number of days, months or years. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Add or Subtract Days from a Date" data-ur="تاریخ میں دن جمع یا منفی کریں">Add or Subtract Days from a Date</h1>
      <p class="sub" data-en="Find the date after or before a number of days, months or years." data-ur="کچھ دن، مہینے یا سال بعد یا پہلے کی تاریخ معلوم کریں۔">Find the date after or before a number of days, months or years.</p>
      <div class="panel">
<div class="options"><label><span data-en="Start date" data-ur="شروع کی تاریخ">Start date</span><input type="date" id="st" dir="ltr" style="padding:9px 12px;border-radius:12px"></label><label><span data-en="Days" data-ur="دن">Days</span><input type="number" id="dd" value="30" dir="ltr" ></label><label><span data-en="Months" data-ur="مہینے">Months</span><input type="number" id="mm" value="0" dir="ltr" ></label><label><span data-en="Years" data-ur="سال">Years</span><input type="number" id="yy" value="0" dir="ltr" ></label></div><div class="stats"><div class="stat"><b id="r">-</b><span data-en="Result date" data-ur="نتیجے کی تاریخ">Result date</span></div><div class="stat"><b id="wd">-</b><span data-en="Weekday" data-ur="دن">Weekday</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Pick a start date and enter how much to add (or a negative number to subtract)." data-ur="شروع کی تاریخ چنیں اور جمع کرنے کی مقدار لکھیں (منفی کے لیے مائنس لگائیں)۔">Pick a start date and enter how much to add (or a negative number to subtract).</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/date-add.js"></script>
</body>
</html>
