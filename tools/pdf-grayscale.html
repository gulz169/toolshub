<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PDF to Black &amp; White | ToolsHub</title>
  <meta name="description" content="Turn a colour PDF into grayscale to save ink. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="PDF to Black &amp; White" data-ur="PDF کو بلیک اینڈ وائٹ کریں">PDF to Black &amp; White</h1>
      <p class="sub" data-en="Turn a colour PDF into grayscale to save ink." data-ur="رنگین PDF کو گرے اسکیل میں بدلیں تاکہ سیاہی بچے۔">Turn a colour PDF into grayscale to save ink.</p>
      <div class="panel">
<div class="dropzone" id="dz"><div class="big">📄</div><strong data-en="Click to choose a PDF or drag &amp; drop here" data-ur="PDF چنیں یا یہاں ڈراپ کریں">Click to choose a PDF or drag &amp; drop here</strong><small data-en="PDF file" data-ur="PDF فائل">PDF file</small></div><input type="file" id="fi" accept="application/pdf,.pdf" hidden><div id="work" hidden><div class="options"><label><span data-en="Quality" data-ur="کوالٹی">Quality</span><select id="q"><option value="1.5">Normal</option><option value="2">High</option><option value="1">Small file</option></select></label></div><div class="actions" style="margin-top:16px"><button class="btn green" id="dl" type="button" data-en="Download" data-ur="ڈاؤن لوڈ">Download</button></div><progress id="pg" value="0" max="1" hidden></progress></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Add a PDF and download the grayscale version. Pages become images, so text is no longer selectable." data-ur="PDF شامل کریں اور گرے اسکیل ورژن ڈاؤن لوڈ کریں۔ صفحات تصویر بن جاتے ہیں اس لیے ٹیکسٹ سلیکٹ نہیں ہوگا۔">Add a PDF and download the grayscale version. Pages become images, so text is no longer selectable.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/fileio.js"></script>
  <script src="../js/pdf-grayscale.js"></script>
</body>
</html>
