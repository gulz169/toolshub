    <div class="container">
      <h1 data-en="CSS Gradient Generator" data-ur="CSS گریڈینٹ جنریٹر">CSS Gradient Generator</h1>

      <div class="panel">
<div class="options"><label><span data-en="Color 1" data-ur="رنگ 1">Color 1</span><input type="color" id="c1" value="#8b5cf6" style="width:70px;height:42px"></label><label><span data-en="Color 2" data-ur="رنگ 2">Color 2</span><input type="color" id="c2" value="#ec4899" style="width:70px;height:42px"></label><label><span data-en="Color 3" data-ur="رنگ 3">Color 3</span><input type="color" id="c3" value="#fbbf24" style="width:70px;height:42px"></label><label><span data-en="Type" data-ur="قسم">Type</span><select id="k"><option value="linear">Linear</option><option value="radial">Radial</option></select></label><label><span data-en="Angle" data-ur="زاویہ">Angle</span><input type="number" id="a" value="135" dir="ltr" min="0" max="360"></label><label><span data-en="Use color 3" data-ur="رنگ 3 استعمال کریں">Use color 3</span><select id="u3"><option value="1">Yes</option><option value="0">No</option></select></label></div><div id="pv" style="height:200px;border-radius:18px;margin-bottom:12px"></div><textarea class="t" id="o" dir="auto" style="min-height:80px" placeholder="" readonly></textarea><div class="actions" style="margin-top:10px"><button class="btn green" id="cp" type="button" data-en="Copy CSS" data-ur="CSS کاپی کریں">Copy CSS</button></div>

        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
