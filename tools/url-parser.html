<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>URL Parser | ToolsHub</title>
  <meta name="description" content="Break a URL into its parts and query parameters. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="URL Parser" data-ur="URL پارسر">URL Parser</h1>
      <p class="sub" data-en="Break a URL into its parts and query parameters." data-ur="URL کو اس کے حصوں اور پیرامیٹرز میں توڑیں۔">Break a URL into its parts and query parameters.</p>
      <div class="panel">
<label><span data-en="URL" data-ur="URL">URL</span><input id="u" type="text" dir="ltr" value="https://example.com:8080/path/page?id=5&name=ali#top" style="padding:9px 12px;border-radius:12px;width:100%"></label><div id="out" style="margin-top:16px;overflow:auto"></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Paste a full URL to see protocol, host, path and parameters." data-ur="مکمل URL پیسٹ کریں اور پروٹوکول، ہوسٹ، پاتھ اور پیرامیٹرز دیکھیں۔">Paste a full URL to see protocol, host, path and parameters.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/url-parser.js"></script>
</body>
</html>
