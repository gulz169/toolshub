<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Emoji Picker | ToolsHub</title>
  <meta name="description" content="Tap emojis to build a message and copy it. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Emoji Picker" data-ur="ایموجی پکر">Emoji Picker</h1>
      <p class="sub" data-en="Tap emojis to build a message and copy it." data-ur="ایموجی پر ٹیپ کر کے میسج بنائیں اور کاپی کریں۔">Tap emojis to build a message and copy it.</p>
      <div class="panel">
<textarea class="t" id="o" dir="auto" style="min-height:70px" placeholder=""></textarea><div class="actions" style="margin:10px 0"><button class="btn green" id="cp" type="button" data-en="Copy" data-ur="کاپی کریں">Copy</button><button class="btn ghost" id="clr" type="button" data-en="Clear" data-ur="صاف کریں">Clear</button></div><div id="g" style="display:flex;flex-wrap:wrap;gap:6px;max-height:340px;overflow:auto"></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Tap any emoji to add it. Then copy." data-ur="کسی بھی ایموجی پر ٹیپ کریں۔ پھر کاپی کریں۔">Tap any emoji to add it. Then copy.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/emoji-picker.js"></script>
</body>
</html>
