<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Unix Timestamp Converter | ToolsHub</title>
  <meta name="description" content="Convert Unix time to a date and back. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Unix Timestamp Converter" data-ur="یونکس ٹائم اسٹیمپ کنورٹر">Unix Timestamp Converter</h1>
      <p class="sub" data-en="Convert Unix time to a date and back." data-ur="یونکس ٹائم کو تاریخ میں اور تاریخ کو ٹائم اسٹیمپ میں بدلیں۔">Convert Unix time to a date and back.</p>
      <div class="panel">
<div style="margin-bottom:12px"><div class="stats"><div class="stat"><b id="now">-</b><span data-en="Now (seconds)" data-ur="ابھی (سیکنڈ)">Now (seconds)</span></div></div></div><div class="options"><label><span data-en="Timestamp" data-ur="ٹائم اسٹیمپ">Timestamp</span><input type="number" id="ts" value="" dir="ltr" ></label></div><div class="stats"><div class="stat"><b id="loc">-</b><span data-en="Local time" data-ur="مقامی وقت">Local time</span></div><div class="stat"><b id="utc">-</b><span data-en="UTC" data-ur="UTC">UTC</span></div></div><div class="options"><label><span data-en="Date and time" data-ur="تاریخ اور وقت">Date and time</span><input type="datetime-local" id="dt" dir="ltr" style="padding:9px 12px;border-radius:12px"></label></div><div class="stats"><div class="stat"><b id="sec">-</b><span data-en="Seconds" data-ur="سیکنڈ">Seconds</span></div><div class="stat"><b id="ms">-</b><span data-en="Milliseconds" data-ur="ملی سیکنڈ">Milliseconds</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Paste a timestamp (seconds or milliseconds) or pick a date and time." data-ur="ٹائم اسٹیمپ (سیکنڈ یا ملی سیکنڈ) لکھیں یا تاریخ اور وقت چنیں۔">Paste a timestamp (seconds or milliseconds) or pick a date and time.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/timestamp-converter.js"></script>
</body>
</html>
