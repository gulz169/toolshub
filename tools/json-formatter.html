<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JSON Formatter &amp; Validator - Free Online | ToolsHub</title>
  <meta name="description" content="Format, beautify, minify and validate JSON online for free. Shows the error line. Works in your browser, nothing is uploaded.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    #txt{width:100%;min-height:340px;padding:14px;border-radius:14px;resize:vertical;direction:ltr;text-align:left;
      font:.92rem/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:inherit}
    .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
  </style>
</head>
<body data-root="../">

  <header id="site-header"></header>

  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="JSON Formatter &amp; Validator" data-ur="JSON فارمیٹر اور ویلیڈیٹر">JSON Formatter &amp; Validator</h1>
      <p class="sub" data-en="Paste JSON to beautify, minify or check it for errors."
         data-ur="JSON پیسٹ کریں، اسے خوبصورت بنائیں، چھوٹا کریں یا غلطیاں چیک کریں۔">Paste JSON to beautify, minify or check it for errors.</p>

      <div class="panel">
        <textarea id="txt" spellcheck="false" aria-label="JSON" placeholder='{"name":"ToolsHub","tools":[1,2,3]}'></textarea>

        <div class="btns">
          <button class="btn green" id="fmtBtn" type="button" data-en="Format" data-ur="فارمیٹ">Format</button>
          <button class="btn" id="minBtn" type="button" data-en="Minify" data-ur="چھوٹا کریں">Minify</button>
          <button class="btn" id="valBtn" type="button" data-en="Validate" data-ur="چیک کریں">Validate</button>
          <div class="options" style="margin:0">
            <label><span data-en="Indent" data-ur="انڈینٹ">Indent</span>
              <select id="indent">
                <option value="2">2 spaces</option>
                <option value="4">4 spaces</option>
                <option value="tab">Tab</option>
              </select></label>
            <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="sortKeys">
              <span data-en="Sort keys A-Z" data-ur="کیز A-Z ترتیب">Sort keys A-Z</span></label>
          </div>
        </div>

        <div class="actions" style="margin-top:14px">
          <button class="btn" id="copyBtn" type="button" data-en="Copy" data-ur="کاپی">Copy</button>
          <button class="btn" id="dlBtn" type="button" data-en="Download .json" data-ur=".json ڈاؤن لوڈ کریں">Download .json</button>
          <button class="btn ghost" id="clearBtn" type="button" data-en="Clear" data-ur="صاف کریں">Clear</button>
        </div>
        <div class="status" id="status"></div>
      </div>

      <div class="ad-slot">Ad space</div>

      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <ol>
          <li data-en="Paste your JSON." data-ur="اپنا JSON پیسٹ کریں۔">Paste your JSON.</li>
          <li data-en="Press Format, Minify or Validate." data-ur="فارمیٹ، چھوٹا کریں یا چیک کریں دبائیں۔">Press Format, Minify or Validate.</li>
          <li data-en="If there is an error, the line and column are shown." data-ur="غلطی ہو تو لائن اور کالم نمبر دکھایا جاتا ہے۔">If there is an error, the line and column are shown.</li>
        </ol>
        <p data-en="Your data never leaves your device." data-ur="آپ کا ڈیٹا آپ کے آلے سے باہر نہیں جاتا۔">Your data never leaves your device.</p>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="../js/common.js"></script>
  <script src="../js/json-formatter.js"></script>
</body>
</html>
