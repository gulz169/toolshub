<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Speed, Distance &amp; Time | ToolsHub</title>
  <meta name="description" content="Leave one box empty and find it. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Speed, Distance &amp; Time" data-ur="رفتار، فاصلہ اور وقت">Speed, Distance &amp; Time</h1>
      <p class="sub" data-en="Leave one box empty and find it." data-ur="ایک خانہ خالی چھوڑیں اور اسے معلوم کریں۔">Leave one box empty and find it.</p>
      <div class="panel">
<div class="options"><label><span data-en="Speed (km/h)" data-ur="رفتار (کلومیٹر/گھنٹہ)">Speed (km/h)</span><input id="s" type="number" dir="ltr" value="60" step="any"></label><label><span data-en="Distance (km)" data-ur="فاصلہ (کلومیٹر)">Distance (km)</span><input id="d" type="number" dir="ltr" value="150" step="any"></label><label><span data-en="Time (hours)" data-ur="وقت (گھنٹے)">Time (hours)</span><input id="tm" type="number" dir="ltr" step="any"></label></div><div class="stats"><div class="stat"><b id="r">-</b><span data-en="Result" data-ur="نتیجہ">Result</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Fill any two of speed, distance and time. The empty one is calculated." data-ur="رفتار، فاصلہ اور وقت میں سے کوئی دو لکھیں۔ خالی والا خود نکل آئے گا۔">Fill any two of speed, distance and time. The empty one is calculated.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/speed-distance-time.js"></script>
</body>
</html>
