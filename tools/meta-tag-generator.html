<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meta Tag Generator | ToolsHub</title>
  <meta name="description" content="Create SEO, Open Graph and Twitter meta tags. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Meta Tag Generator" data-ur="میٹا ٹیگ جنریٹر">Meta Tag Generator</h1>
      <p class="sub" data-en="Create SEO, Open Graph and Twitter meta tags." data-ur="SEO، Open Graph اور Twitter میٹا ٹیگز بنائیں۔">Create SEO, Open Graph and Twitter meta tags.</p>
      <div class="panel">
<div class="options"><label><span data-en="Title" data-ur="ٹائٹل">Title</span><input id="ti" type="text" dir="ltr" value="My Page" style="padding:9px 12px;border-radius:12px;width:min(340px,100%)"></label><label><span data-en="Description" data-ur="تفصیل">Description</span><input id="de" type="text" dir="ltr" value="A short summary of the page." style="padding:9px 12px;border-radius:12px;width:min(340px,100%)"></label><label><span data-en="Keywords" data-ur="کی ورڈز">Keywords</span><input id="kw" type="text" dir="ltr" value="tools, free" style="padding:9px 12px;border-radius:12px;width:min(340px,100%)"></label><label><span data-en="Author" data-ur="مصنف">Author</span><input id="au" type="text" dir="ltr" value="" style="padding:9px 12px;border-radius:12px;width:min(220px,100%)"></label><label><span data-en="Page URL" data-ur="صفحے کا URL">Page URL</span><input id="ur" type="text" dir="ltr" value="https://example.com/" style="padding:9px 12px;border-radius:12px;width:min(340px,100%)"></label><label><span data-en="Image URL" data-ur="تصویر کا URL">Image URL</span><input id="im" type="text" dir="ltr" value="" style="padding:9px 12px;border-radius:12px;width:min(340px,100%)"></label></div><div class="actions" style="margin:10px 0"><button class="btn green" id="cp" type="button" data-en="Copy" data-ur="کاپی کریں">Copy</button></div><textarea class="t" id="o" dir="auto" style="min-height:260px" placeholder="" readonly></textarea>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Fill in your page details and copy the tags into your HTML head." data-ur="صفحے کی تفصیل لکھیں اور ٹیگز اپنے HTML head میں کاپی کریں۔">Fill in your page details and copy the tags into your HTML head.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/meta-tag-generator.js"></script>
</body>
</html>
