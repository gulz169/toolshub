<div class="options"><label><span data-en="Pixels" data-ur="پکسل">Pixels</span><input type="number" id="px" value="24" dir="ltr" ></label><label><span data-en="Base font size" data-ur="بیس فونٹ سائز">Base font size</span><input type="number" id="base" value="16" dir="ltr" ></label></div><div class="stats"><div class="stat"><b id="rem">-</b><span data-en="rem / em" data-ur="rem / em">rem / em</span></div><div class="stat"><b id="pt">-</b><span data-en="Points (pt)" data-ur="پوائنٹس (pt)">Points (pt)</span></div></div><div class="options"><label><span data-en="rem to px" data-ur="rem سے px">rem to px</span><input type="number" id="rv" value="1.5" dir="ltr" ></label></div><div class="stats"><div class="stat"><b id="rp">-</b><span data-en="Pixels" data-ur="پکسل">Pixels</span></div></div>
