<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bill Splitter | ToolsHub</title>
  <meta name="description" content="Split a bill with tip between friends. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Bill Splitter" data-ur="بل تقسیم کریں">Bill Splitter</h1>
      <p class="sub" data-en="Split a bill with tip between friends." data-ur="دوستوں میں بل اور ٹپ تقسیم کریں۔">Split a bill with tip between friends.</p>
      <div class="panel">
<div class="options"><label><span data-en="Bill amount" data-ur="بل کی رقم">Bill amount</span><input type="number" id="b" value="6000" dir="ltr" ></label><label><span data-en="Tip %" data-ur="ٹپ %">Tip %</span><input type="number" id="tp" value="10" dir="ltr" ></label><label><span data-en="People" data-ur="افراد">People</span><input type="number" id="pp" value="4" dir="ltr" min="1"></label></div><div class="stats"><div class="stat"><b id="each">-</b><span data-en="Each pays" data-ur="ہر ایک ادا کرے">Each pays</span></div><div class="stat"><b id="tip">-</b><span data-en="Tip" data-ur="ٹپ">Tip</span></div><div class="stat"><b id="tot">-</b><span data-en="Total" data-ur="کل">Total</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Enter the bill, tip % and number of people." data-ur="بل، ٹپ % اور افراد کی تعداد لکھیں۔">Enter the bill, tip % and number of people.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/bill-splitter.js"></script>
</body>
</html>
