<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Reading Time Estimator" data-ur="ریڈنگ ٹائم اندازہ">Reading Time Estimator</h1>
      <p class="sub" data-en="Estimate how long a text takes to read or speak." data-ur="کوئی ٹیکسٹ پڑھنے یا بولنے میں کتنا وقت لے گا۔">Estimate how long a text takes to read or speak.</p>
      <div class="panel">
<textarea class="t" id="i" dir="auto" style="min-height:170px" placeholder=""></textarea><div class="stats"><div class="stat"><b id="w">-</b><span data-en="Words" data-ur="الفاظ">Words</span></div><div class="stat"><b id="rt">-</b><span data-en="Reading time" data-ur="پڑھنے کا وقت">Reading time</span></div><div class="stat"><b id="st">-</b><span data-en="Speaking time" data-ur="بولنے کا وقت">Speaking time</span></div></div>

      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Paste your text to see words, reading time and speaking time." data-ur="ٹیکسٹ پیسٹ کریں اور الفاظ، پڑھنے اور بولنے کا وقت دیکھیں۔">Paste your text to see words, reading time and speaking time.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
