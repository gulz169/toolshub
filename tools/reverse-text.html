<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reverse Text | ToolsHub</title>
  <meta name="description" content="Reverse letters, words or lines. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Reverse Text" data-ur="ٹیکسٹ الٹا کریں">Reverse Text</h1>
      <p class="sub" data-en="Reverse letters, words or lines." data-ur="حروف، الفاظ یا لائنیں الٹی کریں۔">Reverse letters, words or lines.</p>
      <div class="panel">
<div class="options"><label><span data-en="Reverse" data-ur="الٹا کریں">Reverse</span><select id="m"><option value="c">Letters</option><option value="w">Words order</option><option value="l">Lines order</option></select></label></div><textarea class="t" id="i" dir="auto" style="min-height:110px" placeholder=""></textarea><div class="actions" style="margin:10px 0"><button class="btn green" id="cp" type="button" data-en="Copy" data-ur="کاپی کریں">Copy</button></div><textarea class="t" id="o" dir="auto" style="min-height:110px" placeholder="" readonly></textarea>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Pick what to reverse and type your text." data-ur="چنیں کیا الٹا کرنا ہے اور ٹیکسٹ لکھیں۔">Pick what to reverse and type your text.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/reverse-text.js"></script>
</body>
</html>
