<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice Roller &amp; Coin Flip | ToolsHub</title>
  <meta name="description" content="Roll dice or flip a coin. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Dice Roller &amp; Coin Flip" data-ur="ڈائس اور سکہ">Dice Roller &amp; Coin Flip</h1>
      <p class="sub" data-en="Roll dice or flip a coin." data-ur="ڈائس پھینکیں یا سکہ اچھالیں۔">Roll dice or flip a coin.</p>
      <div class="panel">
<div class="options"><label><span data-en="Dice" data-ur="ڈائس">Dice</span><input type="number" id="n" value="2" dir="ltr" min="1" max="20"></label><label><span data-en="Sides" data-ur="اطراف">Sides</span><input type="number" id="sd" value="6" dir="ltr" min="2" max="100"></label></div><div class="actions"><button class="btn" id="roll" type="button" data-en="Roll" data-ur="ڈائس پھینکیں">Roll</button><button class="btn green" id="flip" type="button" data-en="Flip coin" data-ur="سکہ اچھالیں">Flip coin</button></div><div class="stats"><div class="stat"><b id="r">-</b><span data-en="Result" data-ur="نتیجہ">Result</span></div><div class="stat"><b id="tot">-</b><span data-en="Total" data-ur="مجموعہ">Total</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Choose how many dice and sides, then roll. Or flip a coin." data-ur="ڈائس اور اطراف کی تعداد چنیں اور پھینکیں۔ یا سکہ اچھالیں۔">Choose how many dice and sides, then roll. Or flip a coin.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/dice-coin.js"></script>
</body>
</html>
