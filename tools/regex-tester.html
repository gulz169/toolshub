<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Regex Tester | ToolsHub</title>
  <meta name="description" content="Test regular expressions and see matches live. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Regex Tester" data-ur="ریجیکس ٹیسٹر">Regex Tester</h1>
      <p class="sub" data-en="Test regular expressions and see matches live." data-ur="ریگولر ایکسپریشن ٹیسٹ کریں اور میچ فوراً دیکھیں۔">Test regular expressions and see matches live.</p>
      <div class="panel">
<div class="options"><label><span data-en="Pattern" data-ur="پیٹرن">Pattern</span><input id="p" dir="ltr" value="\b\w+@\w+\.com\b" style="padding:9px 12px;border-radius:12px;width:min(340px,100%)"></label><label><span data-en="Flags" data-ur="فلیگز">Flags</span><input id="fl" dir="ltr" value="gi" style="padding:9px 12px;border-radius:12px;width:90px"></label></div><textarea class="t" id="tx" dir="auto" style="min-height:120px" placeholder=""></textarea><div class="options"><label><span data-en="Replace with (optional)" data-ur="بدلیں (اختیاری)">Replace with (optional)</span><input id="rp" dir="ltr" style="padding:9px 12px;border-radius:12px;width:min(340px,100%)"></label></div><div class="stats"><div class="stat"><b id="cnt">-</b><span data-en="Matches" data-ur="میچ">Matches</span></div></div><div id="hl" dir="auto" style="margin-top:12px;white-space:pre-wrap;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12)"></div><div id="rs" dir="auto" style="margin-top:12px;white-space:pre-wrap;display:none;padding:14px;border-radius:14px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3)"></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Type a pattern, choose flags, and paste your text. Matches are highlighted. Add a replacement to preview it." data-ur="پیٹرن لکھیں، فلیگز چنیں اور ٹیکسٹ پیسٹ کریں۔ میچ ہائی لائٹ ہوں گے۔ ریپلیس کا نتیجہ بھی دیکھ سکتے ہیں۔">Type a pattern, choose flags, and paste your text. Matches are highlighted. Add a replacement to preview it.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/regex-tester.js"></script>
</body>
</html>
