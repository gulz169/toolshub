<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Day of the Week Finder | ToolsHub</title>
  <meta name="description" content="Find the weekday, week number and day of year for any date. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Day of the Week Finder" data-ur="ہفتے کا دن معلوم کریں">Day of the Week Finder</h1>
      <p class="sub" data-en="Find the weekday, week number and day of year for any date." data-ur="کسی بھی تاریخ کا دن، ہفتہ نمبر اور سال کا دن معلوم کریں۔">Find the weekday, week number and day of year for any date.</p>
      <div class="panel">
<div class="options"><label><span data-en="Date" data-ur="تاریخ">Date</span><input type="date" id="dt" dir="ltr" style="padding:9px 12px;border-radius:12px"></label></div><div class="stats"><div class="stat"><b id="wd">-</b><span data-en="Weekday" data-ur="دن">Weekday</span></div><div class="stat"><b id="wk">-</b><span data-en="Week number" data-ur="ہفتہ نمبر">Week number</span></div><div class="stat"><b id="dy">-</b><span data-en="Day of year" data-ur="سال کا دن">Day of year</span></div><div class="stat"><b id="lp">-</b><span data-en="Leap year" data-ur="لیپ ایئر">Leap year</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Pick a date, for example a birthday." data-ur="کوئی تاریخ چنیں، مثلاً سالگرہ۔">Pick a date, for example a birthday.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/day-of-week.js"></script>
</body>
</html>
