<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Markdown Previewer | ToolsHub</title>
  <meta name="description" content="Write Markdown and see it live. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Markdown Previewer" data-ur="مارک ڈاؤن پری ویو">Markdown Previewer</h1>
      <p class="sub" data-en="Write Markdown and see it live." data-ur="مارک ڈاؤن لکھیں اور فوراً پری ویو دیکھیں۔">Write Markdown and see it live.</p>
      <div class="panel">
<textarea class="t" id="in" dir="auto" style="min-height:180px" placeholder="# Hello\n\nSome **bold**, *italic* and `code`.\n\n- item one\n- item two\n\n[link](https://example.com)"></textarea><div class="actions" style="margin:12px 0"><button class="btn green" id="cp" type="button" data-en="Copy HTML" data-ur="HTML کاپی کریں">Copy HTML</button></div><div id="out" dir="auto" style="padding:16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);line-height:1.8"></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Type Markdown on top. The preview updates as you type. Copy the HTML when done." data-ur="اوپر مارک ڈاؤن لکھیں۔ پری ویو ساتھ ساتھ بدلتا ہے۔ مکمل ہونے پر HTML کاپی کریں۔">Type Markdown on top. The preview updates as you type. Copy the HTML when done.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/markdown-preview.js"></script>
</body>
</html>
