<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Image Splitter (Grid) | ToolsHub</title>
  <meta name="description" content="Cut one image into a grid of equal pieces. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Image Splitter (Grid)" data-ur="امیج اسپلٹر (گرڈ)">Image Splitter (Grid)</h1>
      <p class="sub" data-en="Cut one image into a grid of equal pieces." data-ur="ایک تصویر کو برابر ٹکڑوں کے گرڈ میں کاٹیں۔">Cut one image into a grid of equal pieces.</p>
      <div class="panel">
<div class="dropzone" id="dz"><div class="big">🖼️</div><strong data-en="Click to choose an image or drag &amp; drop here" data-ur="تصویر چنیں یا یہاں ڈراپ کریں">Click to choose an image or drag &amp; drop here</strong><small data-en="JPG, PNG or WebP" data-ur="JPG، PNG یا WebP">JPG, PNG or WebP</small></div><input type="file" id="fi" accept="image/*" hidden><div id="work" hidden><div class="options"><label><span data-en="Rows" data-ur="قطاریں">Rows</span><input type="number" id="r" value="3" dir="ltr" min="1" max="10"></label><label><span data-en="Columns" data-ur="کالم">Columns</span><input type="number" id="c" value="3" dir="ltr" min="1" max="10"></label></div><div style="text-align:center"><canvas id="cv" style="max-width:100%;max-height:420px;border-radius:12px"></canvas></div><div class="actions" style="margin-top:16px"><button class="btn green" id="dl" type="button" data-en="Download ZIP" data-ur="ZIP ڈاؤن لوڈ کریں">Download ZIP</button></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Add an image, choose rows and columns, and download all pieces as a ZIP." data-ur="تصویر شامل کریں، قطاریں اور کالم چنیں اور تمام ٹکڑے ZIP میں ڈاؤن لوڈ کریں۔">Add an image, choose rows and columns, and download all pieces as a ZIP.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/fileio.js"></script>
  <script src="../js/image-splitter.js"></script>
</body>
</html>
