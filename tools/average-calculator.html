<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Average Calculator | ToolsHub</title>
  <meta name="description" content="Mean, median, mode, sum and range of a list of numbers. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

  <meta name="mobile-web-app-capable" content="yes">

<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Average Calculator" data-ur="اوسط کیلکولیٹر">Average Calculator</h1>
      <p class="sub" data-en="Mean, median, mode, sum and range of a list of numbers." data-ur="نمبروں کی فہرست کا اوسط، میڈین، موڈ، مجموعہ اور رینج۔">Mean, median, mode, sum and range of a list of numbers.</p>
      <div class="panel">
<textarea class="t" id="i" dir="auto" style="min-height:110px" placeholder=""></textarea><div class="stats"><div class="stat"><b id="n">-</b><span data-en="Count" data-ur="تعداد">Count</span></div><div class="stat"><b id="sum">-</b><span data-en="Sum" data-ur="مجموعہ">Sum</span></div><div class="stat"><b id="mean">-</b><span data-en="Mean" data-ur="اوسط">Mean</span></div><div class="stat"><b id="med">-</b><span data-en="Median" data-ur="میڈین">Median</span></div><div class="stat"><b id="mode">-</b><span data-en="Mode" data-ur="موڈ">Mode</span></div><div class="stat"><b id="min">-</b><span data-en="Min" data-ur="کم از کم">Min</span></div><div class="stat"><b id="max">-</b><span data-en="Max" data-ur="زیادہ سے زیادہ">Max</span></div><div class="stat"><b id="rg">-</b><span data-en="Range" data-ur="رینج">Range</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Type or paste numbers separated by spaces, commas or new lines." data-ur="نمبر لکھیں یا پیسٹ کریں، خالی جگہ، کوما یا نئی لائن سے الگ کریں۔">Type or paste numbers separated by spaces, commas or new lines.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/average-calculator.js"></script>
