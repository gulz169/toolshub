<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Random Number Generator | ToolsHub</title>
  <meta name="description" content="Generate random numbers in any range. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Random Number Generator" data-ur="رینڈم نمبر جنریٹر">Random Number Generator</h1>
      <p class="sub" data-en="Generate random numbers in any range." data-ur="کسی بھی رینج میں رینڈم نمبر بنائیں۔">Generate random numbers in any range.</p>
      <div class="panel">
<div class="options"><label><span data-en="From" data-ur="سے">From</span><input type="number" id="mn" value="1" dir="ltr" ></label><label><span data-en="To" data-ur="تک">To</span><input type="number" id="mx" value="100" dir="ltr" ></label><label><span data-en="How many" data-ur="کتنے">How many</span><input type="number" id="n" value="5" dir="ltr" min="1" max="1000"></label><label><span data-en="Unique" data-ur="منفرد">Unique</span><select id="u"><option value="0">No</option><option value="1">Yes</option></select></label></div><div class="actions"><button class="btn" id="go" type="button" data-en="Generate" data-ur="بنائیں">Generate</button><button class="btn green" id="cp" type="button" data-en="Copy" data-ur="کاپی کریں">Copy</button></div><textarea class="t" id="o" dir="auto" style="min-height:100px" placeholder="" readonly></textarea>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Set the range and how many numbers you want." data-ur="رینج اور نمبروں کی تعداد لکھیں۔">Set the range and how many numbers you want.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/random-number.js"></script>
</body>
</html>
