<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Slug Generator" data-ur="سلگ جنریٹر">Slug Generator</h1>
      <p class="sub" data-en="Turn titles into clean URL slugs." data-ur="ٹائٹل کو صاف URL سلگ میں بدلیں۔">Turn titles into clean URL slugs.</p>
      <div class="panel">
<div class="options"><label><span data-en="Separator" data-ur="جدا کنندہ">Separator</span><select id="s"><option value="-">Hyphen -</option><option value="_">Underscore _</option></select></label></div><textarea class="t" id="i" dir="auto" style="min-height:110px" placeholder="My First Blog Post!\nBest Tools in 2026"></textarea><div class="actions" style="margin:10px 0"><button class="btn green" id="cp" type="button" data-en="Copy" data-ur="کاپی کریں">Copy</button></div><textarea class="t" id="o" dir="auto" style="min-height:110px" placeholder="" readonly></textarea>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Type one title per line. Each line becomes a slug." data-ur="ہر لائن میں ایک ٹائٹل لکھیں۔ ہر لائن کا سلگ بنے گا۔">Type one title per line. Each line becomes a slug.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
