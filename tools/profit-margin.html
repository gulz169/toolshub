<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Profit &amp; Margin Calculator | ToolsHub</title>
  <meta name="description" content="Find profit, margin and markup, or the price for a target margin. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Profit &amp; Margin Calculator" data-ur="پرافٹ اور مارجن کیلکولیٹر">Profit &amp; Margin Calculator</h1>
      <p class="sub" data-en="Find profit, margin and markup, or the price for a target margin." data-ur="منافع، مارجن اور مارک اپ معلوم کریں، یا مطلوبہ مارجن کی قیمت نکالیں۔">Find profit, margin and markup, or the price for a target margin.</p>
      <div class="panel">
<div class="options"><label><span data-en="Cost" data-ur="لاگت">Cost</span><input type="number" id="c" value="800" dir="ltr" ></label><label><span data-en="Selling price" data-ur="فروخت کی قیمت">Selling price</span><input type="number" id="s" value="1000" dir="ltr" ></label></div><div class="stats"><div class="stat"><b id="pf">-</b><span data-en="Profit" data-ur="منافع">Profit</span></div><div class="stat"><b id="mg">-</b><span data-en="Margin %" data-ur="مارجن %">Margin %</span></div><div class="stat"><b id="mk">-</b><span data-en="Markup %" data-ur="مارک اپ %">Markup %</span></div></div><div class="options"><label><span data-en="Target margin %" data-ur="مطلوبہ مارجن %">Target margin %</span><input type="number" id="tm" value="25" dir="ltr" ></label></div><div class="stats"><div class="stat"><b id="np">-</b><span data-en="Price needed" data-ur="درکار قیمت">Price needed</span></div></div>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Enter cost and selling price. Optionally set a target margin to get the price you need." data-ur="لاگت اور فروخت کی قیمت لکھیں۔ چاہیں تو مطلوبہ مارجن لکھ کر قیمت معلوم کریں۔">Enter cost and selling price. Optionally set a target margin to get the price you need.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/profit-margin.js"></script>
</body>
</html>
