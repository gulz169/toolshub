<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Robots.txt Generator | ToolsHub</title>
  <meta name="description" content="Create a robots.txt file for your website. Free online.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0b0a1f">
  <link rel="icon" href="../icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body data-root="../">
  <header id="site-header"></header>
  <main class="tool-wrap">
    <div class="container">
      <h1 data-en="Robots.txt Generator" data-ur="robots.txt جنریٹر">Robots.txt Generator</h1>
      <p class="sub" data-en="Create a robots.txt file for your website." data-ur="اپنی ویب سائٹ کے لیے robots.txt فائل بنائیں۔">Create a robots.txt file for your website.</p>
      <div class="panel">
<div class="options"><label><span data-en="Default" data-ur="ڈیفالٹ">Default</span><select id="m"><option value="a">Allow all crawlers</option><option value="d">Block all crawlers</option></select></label><label><span data-en="Sitemap URL" data-ur="سائٹ میپ URL">Sitemap URL</span><input id="sm" type="text" dir="ltr" value="https://example.com/sitemap.xml" style="padding:9px 12px;border-radius:12px;width:min(340px,100%)"></label></div><label><span data-en="Disallowed paths (one per line)" data-ur="بلاک راستے (ہر لائن میں ایک)">Disallowed paths (one per line)</span><textarea id="ds" class="t" dir="ltr" style="min-height:80px">/admin/&#10;/private/</textarea></label><div class="actions" style="margin:10px 0"><button class="btn green" id="cp" type="button" data-en="Copy" data-ur="کاپی کریں">Copy</button></div><textarea class="t" id="o" dir="auto" style="min-height:130px" placeholder="" readonly></textarea>
        <div class="status" id="status"></div>
      </div>
      <div class="ad-slot">Ad space</div>
      <div class="panel info">
        <h2 data-en="How to use" data-ur="استعمال کا طریقہ">How to use</h2>
        <p data-en="Choose the default rule, add blocked paths and your sitemap link." data-ur="ڈیفالٹ رول چنیں، بلاک کردہ راستے اور سائٹ میپ لنک لکھیں۔">Choose the default rule, add blocked paths and your sitemap link.</p>
        <p data-en="Nothing you enter leaves your device." data-ur="آپ کا درج کیا ہوا آپ کے آلے سے باہر نہیں جاتا۔">Nothing you enter leaves your device.</p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="../js/common.js"></script>
  <script src="../js/robots-txt.js"></script>
</body>
</html>
